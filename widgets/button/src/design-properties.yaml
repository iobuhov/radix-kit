%YAML 1.2
---
# Widget design props:
com.radixkit.widget.button.Button:
  - name: Size
    type: ToggleButtonGroup
    description: The size of the button
    default: "2"
    options:
      - name: "1"
        class: rt-r-size-1
      - name: "2"
        class: rt-r-size-2
      - name: "3"
        class: rt-r-size-3
      - name: "4"
        class: rt-r-size-4

  - name: Variant
    type: ToggleButtonGroup
    description: The visual variant of the button
    options:
      - name: solid
        class: rt-variant-solid
      - name: soft
        class: rt-variant-soft
      - name: classic
        class: rt-variant-classic
      - name: ghost
        class: rt-variant-ghost
      - name: outline
        class: rt-variant-outline
